name: CI

on:
  push:
    branches: ["main", "prototype"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build:app-runtime

      - name: App Runtime package and document rendering
        timeout-minutes: 3
        run: node scripts/test-app-runtime.mjs --package-only

      - name: Workflow persistence regressions
        timeout-minutes: 3
        run: npm run test:regression
        env:
          AI_MODEL: ""
          BUSINESS_FLOW_STORAGE: sqlite
          BUSINESS_FLOW_SQLITE_PATH: .data/ci-workflow-regressions.sqlite
          BUSINESS_FLOW_LOCAL_USER: ci-user

      - name: Upload regression diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            .data/regression-server.log
            .data/review-remaining-results.json
            .data/snowflake/package-http-results.json
